# Interop harness (spec 2026-10-14 §8.1): PieFed built from this tree, Mastodon, PeerTube and Castopod, behind Caddy with an
# internal CA on *.test names. Run via interop/run.sh, never by hand. Nothing here is published to the host network.
# Its own project and pod: unnamed, it would be `pyfedi` like compose.test.yaml's stack, and each stack's `down`
# would remove the other's containers.
name: pyfedi-interop

x-trust: &trust
  volumes:
    - caddy-data:/caddy-data:ro
    - ./interop/trust_ca.sh:/trust_ca.sh:ro
  env_file: ./interop/.env.interop
  networks: [interop]

# PieFed's web and worker containers share the media and tmp trees, as production's bind mounts do (compose.yaml):
# an upload lands on piefed-web and is probed and thumbnailed by piefed-celery-background. `:U` hands each volume to
# the image's user python; the image has no app/static/media to copy that ownership from (.dockerignore).
x-piefed-volumes: &piefed-volumes
  - caddy-data:/caddy-data:ro
  - ./interop/trust_ca.sh:/trust_ca.sh:ro
  - piefed-media:/app/app/static/media:U
  - piefed-tmp:/app/app/static/tmp:U

# Pixelfed's web and Horizon containers. Not the shared env_file: Pixelfed reads DB_HOST and REDIS_HOST, which
# .env.interop sets for Mastodon. .env.pixelfed holds only its APP_KEY.
x-pixelfed-env: &pixelfed-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://pixelfed.test
  APP_DOMAIN: pixelfed.test
  ADMIN_DOMAIN: pixelfed.test
  SESSION_DOMAIN: pixelfed.test
  TRUST_PROXIES: "*"   # Caddy terminates TLS
  SSL_MODE: "off"
  DB_CONNECTION: mysql
  DB_HOST: pixelfed-db
  DB_PORT: "3306"
  DB_DATABASE: pixelfed
  DB_USERNAME: pixelfed
  DB_PASSWORD: pixelfed
  REDIS_CLIENT: phpredis
  REDIS_HOST: pixelfed-redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  CACHE_DRIVER: redis
  QUEUE_DRIVER: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  BROADCAST_DRIVER: log
  LOG_CHANNEL: stderr
  MAIL_DRIVER: log
  MAIL_MAILER: log
  IMAGE_DRIVER: gd   # the image has gd and imagick, not vips
  OPEN_REGISTRATION: "false"
  ENFORCE_EMAIL_VERIFICATION: "false"
  OAUTH_ENABLED: "true"
  ACTIVITY_PUB: "true"
  AP_REMOTE_FOLLOW: "true"
  AP_INBOX: "true"
  AP_OUTBOX: "true"
  AP_SHAREDINBOX: "true"
  AP_LOGGER_ENABLED: "true"   # logs inbound activities: the spike's capture
  PF_NETWORK_TIMELINE: "true"
  PHP_OPCACHE_ENABLE: "1"

x-pixelfed: &pixelfed
  # v0.15.2, the newest stable release on 2026-10-28 (upstream commit b19607f1)
  image: ghcr.io/pixelfed/pixelfed:v0.15.2@sha256:f1237913ef0d392a5afef1dab8e3dd01234435ea90314a3a7221a2ea00932132
  env_file: ./interop/.env.pixelfed
  environment: *pixelfed-env
  volumes:
    - caddy-data:/caddy-data:ro
    - ./interop/trust_ca.sh:/trust_ca.sh:ro
    - ./interop/pixelfed_harness.sh:/pixelfed_harness.sh:ro
    - ./interop/castopod-ca.ini:/usr/local/etc/php/conf.d/zz-harness-ca.ini:ro   # PHP's curl ignores SSL_CERT_FILE
    - pixelfed-storage:/var/www/html/storage:U
  networks: [interop]
  # trust_ca.sh, the isPublicIp patch, then the image's own serversideup entrypoint and command
  entrypoint: ["/trust_ca.sh", "/pixelfed_harness.sh", "docker-php-serversideup-entrypoint"]

# Loops' web and Horizon containers. Not the shared env_file, for Pixelfed's reason; .env.loops holds only its APP_KEY.
# Videos go to S3 (loops-s3), and Caddy serves that bucket read-only as https://s3.test, the public media URL.
x-loops-env: &loops-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://loops.test
  FORCE_HTTPS: "true"   # Caddy terminates TLS
  SSL_MODE: "off"
  DB_CONNECTION: mysql
  DB_HOST: loops-db
  DB_PORT: "3306"
  DB_DATABASE: loops
  DB_USERNAME: loops
  DB_PASSWORD: loops
  REDIS_CLIENT: phpredis
  REDIS_HOST: loops-redis
  REDIS_PASSWORD: "null"
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  BROADCAST_CONNECTION: log
  LOG_CHANNEL: stderr
  LOG_LEVEL: debug
  MAIL_MAILER: log
  FILESYSTEM_DISK: local
  AWS_ACCESS_KEY_ID: loops
  AWS_SECRET_ACCESS_KEY: loops-secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: loops
  AWS_ENDPOINT: http://loops-s3:7070
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  AWS_URL: https://s3.test/loops
  FFMPEG_BINARIES: /usr/bin/ffmpeg
  FFPROBE_BINARIES: /usr/bin/ffprobe
  LOOPS_TRANSCODE_PRESET: ultrafast   # the default `slow` makes every harness upload a minutes-long wait
  LOOPS_API_RATE_LIMITS_ENABLED: "false"
  LOOPS_ADMIN_DASHBOARD_AUTOUPDATE: "false"
  PHP_OPCACHE_ENABLE: "1"
  PHP_POST_MAX_SIZE: 100M
  PHP_UPLOAD_MAX_FILE_SIZE: 100M
  PHP_MEMORY_LIMIT: 512M

x-loops: &loops
  # v1.0.0-beta.15 (upstream commit 0d2a881e4, 2026-10-23), built from source: Loops publishes no public image. Build
  # it with: podman build -t localhost/loops-server:v1.0.0-beta.15 <loops-server checkout at that tag>
  image: localhost/loops-server:v1.0.0-beta.15
  env_file: ./interop/.env.loops
  environment: *loops-env
  volumes:
    - caddy-data:/caddy-data:ro
    - ./interop/trust_ca.sh:/trust_ca.sh:ro
    - ./interop/loops_harness.sh:/loops_harness.sh:ro
    - ./interop/castopod-ca.ini:/usr/local/etc/php/conf.d/zz-harness-ca.ini:ro   # PHP's curl ignores SSL_CERT_FILE
    - loops-storage:/var/www/html/storage:U
  networks: [interop]
  # trust_ca.sh, the private-address patches, then the image's own serversideup entrypoint and command. No scheduler
  # container: its tasks (version checks, server-list and observatory submissions) reach public servers.
  entrypoint: ["/trust_ca.sh", "/loops_harness.sh", "docker-php-serversideup-entrypoint"]

services:
  caddy:
    image: docker.io/library/caddy:2.10@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83
    # Caddy writes its CA dir 0700/0600 root, but the app containers run as non-root users. Publish a world-readable
    # copy of the public root certificate (never the keys) at /data/harness-root.crt for trust_ca.sh.
    entrypoint: ["sh", "-c", "caddy run --config /etc/caddy/Caddyfile --adapter caddyfile & pid=$$!; trap 'kill $$pid' TERM INT; r=/data/caddy/pki/authorities/local/root.crt; until [ -s $$r ]; do sleep 0.5; done; cp $$r /data/harness-root.crt.tmp; chmod 644 /data/harness-root.crt.tmp; chmod 755 /data; mv /data/harness-root.crt.tmp /data/harness-root.crt; wait $$pid"]
    volumes:
      - ./interop/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - loops-s3-data:/srv/s3:ro   # s3.test serves the Loops bucket
    networks:
      interop:
        aliases: [piefed.test, mastodon.test, peertube.test, castopod.test, pixelfed.test, loops.test, s3.test, relay.test]

  piefed-db:
    image: docker.io/library/postgres:17.11@sha256:3cec7eb015ba8adb28139fa5c83b8489cdf0e666e53dfdf20f598ae0cc8739e3
    environment: {POSTGRES_USER: piefed, POSTGRES_PASSWORD: piefed, POSTGRES_DB: piefed}
    tmpfs: [/var/lib/postgresql/data]
    networks: [interop]

  piefed-redis:
    image: docker.io/library/redis:8.10@sha256:6e9101032a2126aeeb4b1e862ac77d2fcf26b831ae37e5ff2e69169f82ddd411
    networks: [interop]

  piefed-web:
    <<: *trust
    environment:
      DATABASE_URL: postgresql+psycopg2://piefed:piefed@piefed-db/piefed   # not in .env.interop: Mastodon reads DATABASE_URL too
      LOG_ACTIVITYPUB_TO_DB: "1"   # inbound activities and why they were ignored land in activity_pub_log
      RATELIMIT_ENABLED: "False"   # the alpha API allows 3 posts a minute; the suite posts one per test
      ACCESS_LOG: "1"   # gunicorn access log: shows a delivery that arrives but leaves no activity_pub_log row
    build: {context: ., target: runtime}
    image: localhost/piefed-interop:latest
    entrypoint: ["/trust_ca.sh", "/usr/bin/tini", "--", "/app/entrypoint.sh"]
    volumes: *piefed-volumes
    depends_on: [caddy, piefed-db, piefed-redis]

  piefed-celery:
    <<: *trust
    environment:
      LOG_ACTIVITYPUB_TO_DB: "1"
      DATABASE_URL: postgresql+psycopg2://piefed:piefed@piefed-db/piefed   # not in .env.interop: Mastodon reads DATABASE_URL too
    image: localhost/piefed-interop:latest
    entrypoint: ["/trust_ca.sh", "/app/entrypoint_celery.sh"]
    volumes: *piefed-volumes
    depends_on: [piefed-web]

  # the background queue (probe_media, A13.9; backfills, maintenance), as production's pyfedi-celery-background
  piefed-celery-background:
    <<: *trust
    environment:
      LOG_ACTIVITYPUB_TO_DB: "1"
      DATABASE_URL: postgresql+psycopg2://piefed:piefed@piefed-db/piefed   # not in .env.interop: Mastodon reads DATABASE_URL too
      CELERY_QUEUES: background,onion_media
      CELERY_CONCURRENCY: "2"
    image: localhost/piefed-interop:latest
    entrypoint: ["/trust_ca.sh", "/app/entrypoint_celery.sh"]
    volumes: *piefed-volumes
    depends_on: [piefed-web]

  mastodon-db:
    image: docker.io/library/postgres:17.11@sha256:3cec7eb015ba8adb28139fa5c83b8489cdf0e666e53dfdf20f598ae0cc8739e3
    environment: {POSTGRES_USER: mastodon, POSTGRES_PASSWORD: mastodon, POSTGRES_DB: mastodon}
    tmpfs: [/var/lib/postgresql/data]
    networks: [interop]

  mastodon-redis:
    image: docker.io/library/redis:8.10@sha256:6e9101032a2126aeeb4b1e862ac77d2fcf26b831ae37e5ff2e69169f82ddd411
    networks: [interop]

  mastodon-web:
    <<: *trust
    image: ghcr.io/mastodon/mastodon:v4.5@sha256:c64a30678a0e6591d7dbcb0924b4aa98eb1fe54ced5b8fe558449d00915bdb42
    entrypoint: ["/trust_ca.sh"]
    command: ["bash", "-c", "bundle exec rails db:prepare && exec bundle exec puma -C config/puma.rb"]
    depends_on: [caddy, mastodon-db, mastodon-redis]

  mastodon-sidekiq:
    <<: *trust
    image: ghcr.io/mastodon/mastodon:v4.5@sha256:c64a30678a0e6591d7dbcb0924b4aa98eb1fe54ced5b8fe558449d00915bdb42
    entrypoint: ["/trust_ca.sh"]
    # depends_on only orders the starts: wait (at most 180s) until mastodon-web has finished db:prepare and serves
    # /health, or sidekiq boots against a half-migrated database and exits
    command:
      - bash
      - -c
      - >-
        for i in $$(seq 1 180); do
        ruby -rnet/http -e 'exit Net::HTTP.start("mastodon-web", 3000) { |h| h.get("/health", "Host" => "mastodon.test") }.is_a?(Net::HTTPSuccess)' 2>/dev/null
        && exec bundle exec sidekiq; sleep 1; done; echo "mastodon-web never became healthy" >&2; exit 1
    depends_on: [mastodon-web]

  peertube-db:
    image: docker.io/library/postgres:17.11@sha256:3cec7eb015ba8adb28139fa5c83b8489cdf0e666e53dfdf20f598ae0cc8739e3
    environment: {POSTGRES_USER: peertube, POSTGRES_PASSWORD: peertube, POSTGRES_DB: peertube}
    tmpfs: [/var/lib/postgresql/data]
    networks: [interop]

  peertube-redis:
    image: docker.io/library/redis:8.10@sha256:6e9101032a2126aeeb4b1e862ac77d2fcf26b831ae37e5ff2e69169f82ddd411
    networks: [interop]

  peertube-web:
    <<: *trust
    # v8.3.1 (production-trixie), the newest stable release on 2026-10-15
    image: docker.io/chocobozzz/peertube:v8.3.1-trixie@sha256:1f161d08b113d77410b8051f764d16a05267692f3b0a3a7b2f0cf887f80ed082
    environment:
      PEERTUBE_WEBSERVER_HOSTNAME: peertube.test
      PEERTUBE_WEBSERVER_PORT: "443"
      PEERTUBE_WEBSERVER_HTTPS: "true"
      PEERTUBE_TRUST_PROXY: '["loopback", "uniquelocal"]'   # Caddy reaches it from 10.90.0.0/16
      PEERTUBE_DB_HOSTNAME: peertube-db
      PEERTUBE_DB_USERNAME: peertube
      PEERTUBE_DB_PASSWORD: peertube
      PEERTUBE_REDIS_HOSTNAME: peertube-redis
      PEERTUBE_ADMIN_EMAIL: root@peertube.test
      PT_INITIAL_ROOT_PASSWORD: interop-root-pw
      PEERTUBE_FEDERATION_PREVENT_SSRF: "false"   # harness only: every peer is on the private 10.90.0.0/16
      PEERTUBE_RATES_LIMIT_API_MAX: "100000"
      PEERTUBE_RATES_LIMIT_LOGIN_MAX: "100000"
      PEERTUBE_RATES_LIMIT_ACTIVITY_PUB_MAX: "100000"
      PEERTUBE_PLUGINS_INDEX_ENABLED: "false"
      PEERTUBE_PEERTUBE_CHECK_LATEST_VERSION_ENABLED: "false"
      NODE_EXTRA_CA_CERTS: /caddy-data/harness-root.crt   # Node ignores SSL_CERT_FILE; trust_ca.sh waits for this file
    # trust_ca.sh first, then the image's own entrypoint (which drops to user peertube) and command
    entrypoint: ["/trust_ca.sh", "/usr/local/bin/entrypoint.sh"]
    command: ["node", "dist/server"]
    depends_on: [caddy, peertube-db, peertube-redis]

  castopod-db:
    image: docker.io/library/mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    environment: {MARIADB_ROOT_PASSWORD: castopod, MARIADB_DATABASE: castopod, MARIADB_USER: castopod, MARIADB_PASSWORD: castopod}
    tmpfs: [/var/lib/mysql]
    networks: [interop]

  castopod-web:
    <<: *trust
    # 1.15.5, the newest stable release on 2026-10-16 (2.0.0-next.4 has the same inbox)
    image: docker.io/castopod/castopod:1.15.5@sha256:4e4f0440520f45257bfeac7be4347defd20048b4efef8f53d73ec9ed3a4f7966
    environment:
      CP_BASEURL: https://castopod.test
      CP_DISABLE_HTTPS: "1"   # Caddy terminates TLS; Castopod's own https redirect would loop behind it
      CP_DATABASE_HOSTNAME: castopod-db
      CP_DATABASE_NAME: castopod
      CP_DATABASE_USERNAME: castopod
      CP_DATABASE_PASSWORD: castopod
      # the REST API seeds episodes (seed_castopod.py); CodeIgniter reads <config>_<property> from the environment
      restapi_enabled: "true"
      restapi_basicAuth: "true"
      restapi_basicAuthUsername: interop
      restapi_basicAuthPassword: interop-api-pw
    volumes:
      - caddy-data:/caddy-data:ro
      - ./interop/trust_ca.sh:/trust_ca.sh:ro
      # PHP's curl and openssl ignore SSL_CERT_FILE: point them at the bundle trust_ca.sh writes
      - ./interop/castopod-ca.ini:/usr/local/etc/php/conf.d/zz-harness-ca.ini:ro
    # trust_ca.sh first, then the image's own s6 /init (exec keeps it PID 1)
    entrypoint: ["/trust_ca.sh", "docker-php-serversideup-entrypoint"]
    command: ["/init"]
    depends_on: [caddy, castopod-db]

  pixelfed-db:
    image: docker.io/library/mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    environment: {MARIADB_ROOT_PASSWORD: pixelfed, MARIADB_DATABASE: pixelfed, MARIADB_USER: pixelfed, MARIADB_PASSWORD: pixelfed}
    tmpfs: [/var/lib/mysql]
    networks: [interop]

  pixelfed-redis:
    image: docker.io/library/redis:8.10@sha256:6e9101032a2126aeeb4b1e862ac77d2fcf26b831ae37e5ff2e69169f82ddd411
    networks: [interop]

  pixelfed-web:
    <<: *pixelfed
    environment:
      <<: *pixelfed-env
      AUTORUN_ENABLED: "true"   # the image migrates, links storage and caches config at boot
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "false"   # isolation takes a cache lock; one web container needs none
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
    # the image's command: overriding the entrypoint drops it
    command: ["frankenphp", "run", "--config", "/etc/frankenphp/Caddyfile", "--adapter", "caddyfile"]
    depends_on: [caddy, pixelfed-db, pixelfed-redis]

  pixelfed-horizon:
    <<: *pixelfed
    # Horizon runs every queue: deliveries (`deliver`), inbox processing, media and fan-out. Wait (at most 300s)
    # until pixelfed-web has migrated and serves nodeinfo (v0.15.2 has no /up route), or Horizon boots against a half-migrated database
    command:
      - sh
      - -c
      - >-
        for i in $$(seq 1 300); do
        php -r 'exit(@file_get_contents("http://pixelfed-web:8080/api/nodeinfo/2.0.json") === false ? 1 : 0);'
        && exec php artisan horizon; sleep 1; done; echo "pixelfed-web never came up" >&2; exit 1
    depends_on: [pixelfed-web]

  loops-db:
    image: docker.io/library/mysql:9@sha256:86b390ef642f89a0157d6215dee33ddc928b8b0ecab173117f56f6c40cb24eab
    environment: {MYSQL_ROOT_PASSWORD: loops, MYSQL_DATABASE: loops, MYSQL_USER: loops, MYSQL_PASSWORD: loops}
    tmpfs: [/var/lib/mysql]
    networks: [interop]

  loops-redis:
    image: docker.io/library/redis:8.10@sha256:6e9101032a2126aeeb4b1e862ac77d2fcf26b831ae37e5ff2e69169f82ddd411
    networks: [interop]

  # S3 for Loops' videos (MinIO publishes no image any more). The posix backend keeps each object as a plain file at
  # /data/root/<bucket>/<key>, which Caddy serves as https://s3.test/<bucket>/<key>; metadata goes to a sidecar dir.
  loops-s3:
    image: docker.io/versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    environment: {ROOT_ACCESS_KEY: loops, ROOT_SECRET_KEY: loops-secret}
    entrypoint: ["sh", "-c", "mkdir -p /data/root/loops /data/meta && exec versitygw --port :7070 posix --sidecar /data/meta /data/root"]
    volumes:
      - loops-s3-data:/data
    networks: [interop]

  loops-web:
    <<: *loops
    environment:
      <<: *loops-env
      AUTORUN_ENABLED: "true"   # the image migrates, links storage and caches config at boot
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "false"   # isolation takes a cache lock; one web container needs none
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
    # the image's command: overriding the entrypoint drops it
    command: ["frankenphp", "run", "--config", "/etc/frankenphp/Caddyfile", "--adapter", "caddyfile"]
    depends_on: [caddy, loops-db, loops-redis, loops-s3]

  loops-horizon:
    <<: *loops
    # Horizon runs every queue: federation in and out, remote video downloads, transcoding. Wait (at most 300s) until
    # loops-web has migrated and answers /up, or Horizon boots against a half-migrated database
    command:
      - sh
      - -c
      - >-
        for i in $$(seq 1 300); do
        php -r 'exit(@file_get_contents("http://loops-web:8080/up") === false ? 1 : 0);'
        && exec php artisan horizon; sleep 1; done; echo "loops-web never came up" >&2; exit 1
    depends_on: [loops-web]

  # A stand-in for Relay by Loops (interop/relay_standin.py: the published relay cannot run), in PieFed's image for its
  # cryptography and httpx
  loops-relay:
    <<: *trust
    image: localhost/piefed-interop:latest
    entrypoint: ["/trust_ca.sh", "python", "/relay_standin.py"]
    volumes:
      - caddy-data:/caddy-data:ro
      - ./interop/trust_ca.sh:/trust_ca.sh:ro
      - ./interop/relay_standin.py:/relay_standin.py:ro
    depends_on: [caddy, piefed-web]

  interop-runner:
    <<: *trust
    environment:
      DATABASE_URL: postgresql+psycopg2://piefed:piefed@piefed-db/piefed   # not in .env.interop: Mastodon reads DATABASE_URL too
    build: {context: ., target: test}
    image: localhost/piefed-interop-runner:latest
    entrypoint: ["/trust_ca.sh"]
    working_dir: /app
    volumes:
      - caddy-data:/caddy-data:ro
      - ./interop/trust_ca.sh:/trust_ca.sh:ro
      - ./interop:/app/interop:ro
      - ./tests/fixtures/media:/app/tests/fixtures/media:ro   # test_media_pipeline uploads these
    profiles: [runner]

  conformance-runner:
    <<: *trust
    environment:
      DATABASE_URL: postgresql+psycopg2://piefed:piefed@piefed-db/piefed   # not in .env.interop: Mastodon reads DATABASE_URL too
      NODE_EXTRA_CA_CERTS: /caddy-data/harness-root.crt   # node adds this to its built-in roots; trust_ca.sh sets the Python variables
    build: {context: ., dockerfile: interop/conformance/Containerfile}
    image: localhost/piefed-conformance-runner:latest
    entrypoint: ["/trust_ca.sh"]
    working_dir: /app
    volumes:
      - caddy-data:/caddy-data:ro
      - ./interop/trust_ca.sh:/trust_ca.sh:ro
      - ./interop:/app/interop   # read-write: the results land in interop/conformance/results
    profiles: [conformance]

volumes:
  caddy-data:
  piefed-media:
  piefed-tmp:
  pixelfed-storage:
  loops-storage:
  loops-s3-data:

networks:
  interop:
    ipam:
      config:
        - subnet: 10.90.0.0/16
