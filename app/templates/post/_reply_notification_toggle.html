<form method="post" action="{{ url_for('post.post_reply_notification', post_reply_id=comment['comment'].id) }}" class="d-inline"
hx-post="{{ url_for('post.post_reply_notification', post_reply_id=comment['comment'].id) }}" hx-trigger="submit throttle:1s" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit"
class="btn btn-link p-0 border-0 align-baseline fe {{ 'fe-bell' if comment['comment'].notify_new_replies(current_user.id) else 'fe-no-bell' }}"
title="{{ _('Notify about replies') }}" aria-label="{{ _('Notify about replies') }}"></button></form>
