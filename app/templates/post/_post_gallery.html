{# A post's gallery: a gallery post's pictures (spec 2026-11-01 G-7), or the images beside a link #}
{% set blur_images = post.blur_images(current_user) -%}
{% for gallery_image in post.gallery_pictures() -%}
    <a href="{{ gallery_image.view_url(resize=low_bandwidth) }}" rel="nofollow ugc" class="post_gallery_image">
        <img src="{{ gallery_image.medium_url() }}"
                alt="{{ gallery_image.alt_text if gallery_image.alt_text else post.title }}"
                loading="lazy" referrerpolicy="same-origin" class="{{ 'blur' if blur_images }}"
                {% if gallery_image.width and gallery_image.height -%}width="{{ gallery_image.width }}" height="{{ gallery_image.height }}"{% endif %} />
    </a>
{% endfor -%}
