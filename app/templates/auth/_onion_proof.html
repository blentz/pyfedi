{# Onion login and registration only (spec 3.7a A): the challenge onion_pow.js solves before the form is sent, and,
   for a browser without JavaScript (or without crypto.subtle), a link to the timed wait step. After a refused proof
   that link is shown outright: <noscript> is not rendered where an extension, not the browser, blocks scripts.
   Every URL is relative.
   autocomplete=off: Firefox would otherwise restore the old hidden values on reload, beside the new challenge's
   data attributes. -#}
{% if onion_proof -%}
    {{ form.pow_token(autocomplete='off') }}
    {{ form.pow_nonce(autocomplete='off', **{'data-salt': onion_proof.salt, 'data-bits': onion_proof.bits}) }}
    {{ form.wait_token(autocomplete='off') }}
    {% if onion_proof.refused -%}
    <p class="small"><a href="{{ onion_proof.wait_url }}">{{ _('Without JavaScript? Wait a few seconds here first.') }}</a></p>
    {% else -%}
    <noscript>
        <p class="small"><a href="{{ onion_proof.wait_url }}">{{ _('Without JavaScript? Wait a few seconds here first.') }}</a></p>
    </noscript>
    {% endif -%}
    <p class="small" id="onion_pow_fallback" hidden><a href="{{ onion_proof.wait_url }}">{{ _('Your browser cannot run the check here. Wait a few seconds here first.') }}</a></p>
    <script type="module" src="{{ url_for('static', filename='js/onion_pow.js', changed=getmtime('js/onion_pow.js')) }}" nonce="{{ nonce }}"></script>
{% endif -%}
