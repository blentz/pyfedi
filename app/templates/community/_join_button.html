<form method="post" action="/community/{{ community.link() }}/subscribe" class="d-inline"
      hx-post="/community/{{ community.link() }}/subscribe" hx-trigger="submit throttle:1s" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="btn btn-primary btn-sm"
   aria-label="{{ _('Join %(name)s', name=community.display_name()) }}"><span class="fe fe-join"></span> {{ _('Join') }}</button></form>
