# Sub-project 83 slice C. Six defects: every first-time Google or Discord
# signup was a 500 (D1138); the OAuth path took user names the registration
# form refuses, including `admin` (D1139) and one already held in another
# case (D1140); two accounts could hold one email address (D1141); a banned
# visitor was given an account and a session (D1142); a provider that gives
# no email crashed the callback (D1143).
app/auth/oauth_util.py = 100
# Sub-project 83 slice D. Seven defects: the login name went into an LDAP
# search filter (D1145) and a bind DN (D1146) unescaped; an empty password is
# an anonymous bind, and it succeeded (D1147); the directory arm made none of
# the local arm's checks, so a banned account logged in (D1148); and the
# directory could mint a second row for a deleted name (D1149) or any name at
# all, `admin` included (D1150).
app/ldap_utils.py = 100
# Sub-project 83 slice E. Six defects: the content filter the filter screen
# existed to create was made only for somebody who already had one (D1152); a
# topic id that was not a number was a 500 (D1153); onboarding joined PRIVATE
# communities with no approval (D1154); looking at the topics page finished
# onboarding (D1155); and "you have joined some communities" was said when
# nothing had been joined (D1156).
app/auth/onboarding.py = 100
# Sub-project 83 slice F closes the module and the sub-project. Five defects:
# ip2location let httpx.HTTPError escape (D1159) and read `data['city']` off a
# bogon answer (D1160), either of which took the whole authentication surface
# down, since get_country runs on every registration, login and OAuth
# callback; no_admins_logged_in_recently compared a null last_seen (D1161);
# somebody holding both roles was told twice about one application (D1162);
# and every registration wrote the LDAP directory twice (D1163).
app/auth/util.py = 100
app/auth/routes.py = 100
app/user/passkeys.py = 100
# Sub-project 84 slice A. Three defects: any account could report any
# conversation by id, which puts its message history in front of the
# administrators (D1167); the documented `conversation_id` form of
# get_private_message_conversation was KeyError: 'person_id' for everybody
# (D1168); and both resolve endpoints read attributes off a db.session.get
# that answers None (D1169).
app/api/alpha/utils/private_message.py = 100
# Sub-project 84 slice B. Two defects: post_feed_follow asked nothing about
# who may see the feed, and `show_feed` serves a private feed to anyone who is
# subscribed -- so following by id walked around the restriction entirely
# (D1173); and get_feed's name form took parts[1] without checking there was
# one, so every bare feed name was an IndexError (D1174).
app/api/alpha/utils/feed.py = 100
app/api/alpha/utils/admin.py = 100
app/api/alpha/__init__.py = 100

# Sub-project 79, slices A-F. The module was deliberately left unfloored from
# slice A to slice E: the figure rose every round and an interim floor is a
# number with no meaning. Taken at the end of slice F, with every function that
# decides who may do what -- the entry points, the site profile, the federation
# allow/block lists, both remote scans, the permissions page, masquerade and
# the whole user-administration group -- at zero gaps. What remains uncovered
# is communities, topics, content and CMS pages.
app/admin/routes.py = 67

# Sub-project 80, slices A-I. `app/community/routes.py` closes at ONE
# uncovered line out of 3,072, and that one is marked `# pragma: no cover`
# with its reason: `show_community`'s feed-parent walk carries a nil guard
# that `feed_parent_feed_id_fkey` makes unreachable, held against the
# constraint being relaxed. Everything else is covered.
#
# The floor is on `percent_covered`, which with `branch = True` combines
# statements and branches. Statements are at **100.0%** (1,944 of 1,944);
# branches are at 95.9% (811 of 846), which puts the combined figure at 98.75%.
# The floor is set at 98 for that reason, NOT because a statement is missing.
#
# The 33 remaining partial branches are the next target in this module: each is
# a condition whose false arm no row constructs, and this campaign's own
# evidence -- D907's five instances, D992's five, D1012's three -- says that is
# exactly where the next defect is. They are recorded in the findings ledger
# under slice I rather than left to be rediscovered.
#
# This module holds the community page, the posting surface, both moderation
# queues, the moderator and owner management, the RSS importer and every
# fragment endpoint that renders part of a community -- and the nine slices
# found THIRTY-ONE production defects in it, most of them access control.
# Anything that drops coverage here is removing a test that is load-bearing.
app/community/routes.py = 98

# Sub-project 81, slices A-H. `app/user/routes.py` closes with **every
# statement covered** (1,626 of 1,626) and 591 of 618 branches, which is
# 98.80% combined -- the figure this floor is measured against, for the reason
# recorded next to `app/community/routes.py` above: `branch = True` makes
# `percent_covered` a blend of the two.
#
# The 27 remaining partial branches are this module's next target, and they are
# the same kind the community module's are: a condition whose false arm no row
# constructs.
#
# The module went from 12.7% to this across eight slices and 22 production
# defects -- among them a banned account that could still file reports, an
# unbounded settings upload, an open redirect, every uploaded file's URL
# enumerable by any logged-in account, and a "reject" that recorded an
# acceptance. It is the account surface: profile, settings, blocking,
# reporting, deletion. Coverage that drops here is a test that was holding one
# of those.
app/user/routes.py = 98

# Sub-project 82 closed this module: 0 functions with gaps, 98.6% combined
# (100% of statements, the remainder partial branches). Six slices, 498 rows,
# 51 production defects -- among them an unpublished post readable by anyone,
# five more private-community leaks, "I changed my mind" with no authorization
# at all, a post moveable into a private community, an open redirect in the
# share button, and twelve sites of one shape: two ids in one URL, with the
# authorization made against the wrong one.
app/post/routes.py = 98
