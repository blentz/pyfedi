[pytest]
# A regression in a loop-bearing pure function (e.g. human_filesize's unit cap,
# days_to_add_for_next_month's backtracking loop) can turn an infinite loop into
# a hung test instead of a failure. Without a timeout, that hangs the whole
# suite until something external kills it, and CI reports "cancelled/timed out"
# with no pointer to the offending test. 60s is deliberately generous: the
# slowest single test measured is 9s (test_fixup_url.py's retry-swallowing
# cases, which wait on real backoff), so this cannot trip a legitimately slow
# test. It is a PER-TEST limit -- see session_timeout below for the whole-run
# budget.
timeout = 60

# A whole-run budget, distinct from the per-test `timeout` above. That one
# catches a single hung test; it cannot catch a run where every test is
# merely slow, which is the shape an unhealthy environment actually takes --
# observed twice at ~880s and ~910s against a normal 150-260s, with no
# individual test anywhere near its 60s limit, so nothing failed and the run
# just quietly cost a quarter of an hour.
#
# 600s is deliberately loose: the slowest legitimate full run measured is
# 260s (a COLD stack, right after `--down`, replaying every migration), and
# `--cov=app --cov-branch` adds about 1.4x on top of a warm run. Anything
# past 600s is not a slow suite, it is a broken environment, and it should
# fail loudly rather than be waited out.
#
# Checked BETWEEN tests, so the run stops at the first test to start after
# the budget is spent, and exits non-zero.
session_timeout = 600
