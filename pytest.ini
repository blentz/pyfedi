[pytest]
# A regression in a loop-bearing pure function (e.g. human_filesize's unit cap,
# days_to_add_for_next_month's backtracking loop) can turn an infinite loop into
# a hung test instead of a failure. Without a timeout, that hangs the whole
# suite until something external kills it, and CI reports "cancelled/timed out"
# with no pointer to the offending test. 60s is deliberately generous: the
# slowest single test measured is 9s (test_fixup_url.py's retry-swallowing
# cases, which wait on real backoff), so this cannot trip a legitimately slow
# test. It is a PER-TEST limit -- see session_timeout below for the whole-run
# budget.
timeout = 60

# A whole-run budget, distinct from the per-test `timeout` above. That one
# catches a single hung test; it cannot catch a run where every test is
# merely slow, which is the shape an unhealthy environment actually takes --
# observed twice at ~880s and ~910s against a normal 150-260s, with no
# individual test anywhere near its 60s limit, so nothing failed and the run
# just quietly cost a quarter of an hour.
#
# RAISED FROM 600 TO 1200 ON 2026-09-19, and the reasoning it replaced is
# kept here because the number is only as good as the measurements under it.
#
# The old comment read: "600s is deliberately loose: the slowest legitimate
# full run measured is 260s (a COLD stack, right after `--down`, replaying
# every migration), and `--cov=app --cov-branch` adds about 1.4x on top of a
# warm run. Anything past 600s is not a slow suite, it is a broken
# environment." That was true when it was written and is not true now: the
# coverage campaign has added roughly 1,100 tests since, and the last four
# warm coverage runs measured 435s, 455s, 546s and 577s -- a healthy suite
# walking into the budget. On 2026-09-19 one crossed it, stopping at 600.48s
# with 4786 of ~6100 tests run and no failure to point at, which is exactly
# the shape this setting exists to prevent being mistaken for a pass.
#
# 1200s keeps the same purpose against the same evidence: roughly twice the
# slowest healthy coverage run measured, so an environment that is genuinely
# unwell still fails loudly rather than being waited out. Re-measure it when
# the healthy run approaches it again, rather than doubling it by reflex.
#
# RAISED FROM 1200 TO 1800 ON 2026-09-22, on the measurements below.
#
# Sub-project 83 walked into it the same way: three full runs stopped at
# 1200s with 7018, 6712 and then all-but-a-few tests run, and the suite had
# grown to ~8,760 tests. The measured coverage runs that round were 950s,
# 1080s and 1516s -- the spread is the HOST, not the suite: the 1516s run
# shared the machine with a game at 475% CPU and five other processes, at
# load average 12. The 950s run is what this suite costs on a quiet box.
#
# 1800s is chosen against the worst of those, not the best: a contended run
# of today's suite finishes inside it, so the budget still only fires for an
# environment that is genuinely unwell rather than merely busy. That is the
# same rule the 600 -> 1200 change used.
#
# A run that hits this budget still exits 0 -- see fact 540. Read the test
# count, not just the last line.
#
# RAISED FROM 1800 TO 2700 ON 2026-09-24, on the measurement below.
#
# Sub-project 88's ratchet run stopped at 1800.36s with 9642 of ~10,340 tests
# run -- the same shape as the two raises above, one round later. The suite
# has grown by roughly 1,580 tests since the 1800 was set against a suite of
# ~8,760 and a contended run of 1516s; 1516 * 10340/8760 is about 1790s, so
# the budget was reached by growth alone, exactly on schedule, and not by an
# unwell host.
#
# 2700s is 1.5x that, chosen the same way the last two were: against the
# contended measurement rather than the quiet one, so a genuinely sick
# environment still fails loudly. Re-measure when a healthy run approaches
# it rather than doubling it by reflex.
#
# Checked BETWEEN tests, so the run stops at the first test to start after
# the budget is spent, and exits non-zero.
session_timeout = 2700

# The ONLY warning filter in this file, and it is deliberately narrow: module,
# category and message text all pinned.
#
# `ics` 0.7.3 serializes an alarm by calling `str(alarm)` on it
# (`ics/serializers/event_serializer.py:104`), and `Component.__str__` warns
# that its own behaviour changes in 0.9. The call is INSIDE the library; the
# only way to avoid it from our side is to stop attaching the 30-minute
# reminder to events in `show_community_ical`, which is a product feature, so
# the trade is wrong. 0.8 is the first release that fixes it and is still
# alpha.
#
# This does not hide anything of ours: any other FutureWarning, from any other
# module, still shows. Remove this line when `ics` is upgraded.
# The SECOND filter, added 2026-09-22, pinned the same three ways.
#
# `flask_login` 0.6.3 builds the "remember me" cookie's expiry with
# `datetime.utcnow()` (`flask_login/login_manager.py:488`), which Python 3.12
# deprecates. The call is INSIDE the library, on the path every
# `login_user(..., remember=True)` takes -- which is what a real login does,
# so the only way to avoid it from our side is to stop testing logins.
#
# It appeared when sub-project 83 added rows that log in through the form
# rather than by writing a session cookie by hand: 7 new warnings from 7 such
# rows, against a suite baseline of 258.
#
# This does not hide anything of ours: any other DeprecationWarning, from any
# other module, still shows -- including one from our own code with the same
# message. Remove this line when `flask_login` is upgraded.
# The THIRD filter, added 2026-09-24, pinned the same three ways.
#
# `botocore` signs every request with `datetime.utcnow()`
# (`botocore/auth.py:422`), which Python 3.12 deprecates. The call is INSIDE
# the library, on the path every signed S3 request takes, so the only way to
# avoid it from our side is to stop testing the S3 branch of the image
# handling -- and that branch is where an instance's uploads actually go when
# it is configured for object storage.
#
# It appeared when sub-project 95 covered `save_icon_file` and
# `save_banner_file` against moto: 20 new warnings from 8 such rows, against a
# suite baseline of 465.
#
# This does not hide anything of ours: any other DeprecationWarning, from any
# other module, still shows. Remove this line when `botocore` is upgraded.
# The fourth entry, added when the suite learned to run in parallel. `ldap3`
# imports `tagMap` and `typeMap` from `pyasn1`, which deprecated both in favour
# of `TAG_MAP`/`TYPE_MAP`; nothing in this repository can fix that, and the
# import happens ONCE PER PROCESS. Serially that was two warnings; on four
# workers it is ten, so the suite's warning count -- which this campaign uses as
# a ratchet -- depended on how the suite had been run rather than on the code.
# 455 either way with this line. Remove it when ldap3 is upgraded.
filterwarnings =
    ignore:Behaviour of str\(Component\).*:FutureWarning:ics.component
    ignore:tagMap is deprecated.*:DeprecationWarning:ldap3.utils.asn1
    ignore:typeMap is deprecated.*:DeprecationWarning:ldap3.utils.asn1
    ignore:datetime.datetime.utcnow\(\) is deprecated.*:DeprecationWarning:flask_login.login_manager
    ignore:datetime.datetime.utcnow\(\) is deprecated.*:DeprecationWarning:botocore.auth

# `xdist_group` decides which worker a test runs on, and tests/conftest.py's
# pytest_collection_modifyitems puts one on EVERY test: its own module's name,
# or the shared-static group for the modules that name `app/static/`. pytest
# warns about a mark it does not know (`PytestUnknownMarkWarning`), and the
# suite's warning count is a ratchet, so it is declared here rather than left to
# add three warnings to every run.
markers =
    xdist_group: the worker this test belongs on (set for every test in conftest)
