[pytest]
# A regression in a loop-bearing pure function (e.g. human_filesize's unit cap,
# days_to_add_for_next_month's backtracking loop) can turn an infinite loop into
# a hung test instead of a failure. Without a timeout, that hangs the whole
# suite until something external kills it, and CI reports "cancelled/timed out"
# with no pointer to the offending test. 60s is deliberately generous: the
# slowest single test measured is 9s (test_fixup_url.py's retry-swallowing
# cases, which wait on real backoff), so this cannot trip a legitimately slow
# test. It is a PER-TEST limit -- see session_timeout below for the whole-run
# budget.
timeout = 60

# A whole-run budget, distinct from the per-test `timeout` above. That one
# catches a single hung test; it cannot catch a run where every test is
# merely slow, which is the shape an unhealthy environment actually takes --
# observed twice at ~880s and ~910s against a normal 150-260s, with no
# individual test anywhere near its 60s limit, so nothing failed and the run
# just quietly cost a quarter of an hour.
#
# RAISED FROM 600 TO 1200 ON 2026-09-19, and the reasoning it replaced is
# kept here because the number is only as good as the measurements under it.
#
# The old comment read: "600s is deliberately loose: the slowest legitimate
# full run measured is 260s (a COLD stack, right after `--down`, replaying
# every migration), and `--cov=app --cov-branch` adds about 1.4x on top of a
# warm run. Anything past 600s is not a slow suite, it is a broken
# environment." That was true when it was written and is not true now: the
# coverage campaign has added roughly 1,100 tests since, and the last four
# warm coverage runs measured 435s, 455s, 546s and 577s -- a healthy suite
# walking into the budget. On 2026-09-19 one crossed it, stopping at 600.48s
# with 4786 of ~6100 tests run and no failure to point at, which is exactly
# the shape this setting exists to prevent being mistaken for a pass.
#
# 1200s keeps the same purpose against the same evidence: roughly twice the
# slowest healthy coverage run measured, so an environment that is genuinely
# unwell still fails loudly rather than being waited out. Re-measure it when
# the healthy run approaches it again, rather than doubling it by reflex.
#
# Checked BETWEEN tests, so the run stops at the first test to start after
# the budget is spent, and exits non-zero.
session_timeout = 1200

# The ONLY warning filter in this file, and it is deliberately narrow: module,
# category and message text all pinned.
#
# `ics` 0.7.3 serializes an alarm by calling `str(alarm)` on it
# (`ics/serializers/event_serializer.py:104`), and `Component.__str__` warns
# that its own behaviour changes in 0.9. The call is INSIDE the library; the
# only way to avoid it from our side is to stop attaching the 30-minute
# reminder to events in `show_community_ical`, which is a product feature, so
# the trade is wrong. 0.8 is the first release that fixes it and is still
# alpha.
#
# This does not hide anything of ours: any other FutureWarning, from any other
# module, still shows. Remove this line when `ics` is upgraded.
filterwarnings =
    ignore:Behaviour of str\(Component\).*:FutureWarning:ics.component
