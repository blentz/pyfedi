# Ephemeral Postgres and Redis for the test suite.
#
# Data lives in tmpfs, so nothing survives `podman-compose down` and no state can
# leak between runs. Ports differ from compose.dev.yaml (5432/6379) so this stack
# can run alongside the dev stack without colliding.
services:

  test-db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: pyfedi
      POSTGRES_PASSWORD: pyfedi
      POSTGRES_DB: pyfedi_test
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    tmpfs:
      - /var/lib/postgresql/data
    # No published host ports on purpose. test-runner reaches these services over
    # the compose network by name, so nothing needs a host port -- and publishing
    # one would mean two checkouts of this repo (a git worktree, say) could never
    # run tests at the same time, because the second stack cannot bind the port.
    # That failure looks like Postgres hanging rather than a port clash.
    #
    # To inspect a running test database from the host:
    #   podman-compose -f compose.test.yaml exec test-db psql -U pyfedi pyfedi_test
    #   podman-compose -f compose.test.yaml exec test-redis redis-cli
    networks:
      - pf_test_network

  test-redis:
    image: docker.io/library/redis:6.2
    networks:
      - pf_test_network

  # Tests run in here, not on the host: this repo has no host Python environment
  # (no venv, no .env, and system python3 has no Flask). The Dockerfile's `test`
  # target is `builder` plus requirements-test.txt, so /venv carries pytest,
  # pytest-cov, pytest-timeout, respx, moto, fakeredis and atheris on top of
  # every production requirement. It is preferred over `runtime` because it runs
  # as root — avoiding __pycache__ permission failures on the bind mount — and
  # skips the tesseract layer tests do not need.
  #
  # `test`, NOT `builder`: the test dependencies deliberately do not live in
  # requirements.txt, because that file is the production install and atheris has
  # no aarch64 wheel. Pointing this at `builder` gives a container that cannot
  # collect the suite.
  test-runner:
    build:
      context: .
      target: test
    depends_on:
      - test-db
      - test-redis
    env_file:
      - ./.env.test
    environment:
      PATH: /venv/bin:/usr/local/bin:/usr/bin:/bin
      PYTHONUNBUFFERED: "1"
    working_dir: /app
    volumes:
      - ./:/app:z
    command: ["sleep", "infinity"]
    networks:
      - pf_test_network

networks:
  pf_test_network:
    name: pf_test_network
    external: false
