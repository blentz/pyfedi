[pytest]
# Interop harness tests (spec 2026-10-14 §8.1). Run only via interop/run.sh test. These talk to real containers;
# tests/conftest.py (which blocks outbound HTTP) does not apply here.
testpaths = interop
timeout = 120
# the interop dir is mounted read-only in the runner, so the cache cannot be written
addopts = -p no:cacheprovider --color=no
markers =
    interop: runs against the interop harness containers
