[pytest]
# The client-app harness (interop/apps/README.md). Run only via interop/run.sh apps (or interop/run_remote.sh apps):
# these drive real apps against the interop stack's PieFed. An app's steps are bounded by their own waits; the timeout
# is the backstop for a hung emulator or browser.
testpaths = interop/apps
timeout = 600
addopts = -p no:cacheprovider --color=no -rA
